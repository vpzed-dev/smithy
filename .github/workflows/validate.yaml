name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read-only rendering only: satisfies the state-encryption config and
      # its >=16-char validation. No state is created or read in CI.
      TF_VAR_state_passphrase: ci-dummy-passphrase-render-only
      # The one collections path every ansible tool here agrees on. Each has
      # its own default view of where collections live - the runner ships some
      # preinstalled, ansible-lint runs from its own pipx venv and sees neither
      # those nor ansible-core's - and ansible-compat keeps (and prepends its
      # cache to) whatever this names. Singular _PATH: ansible-compat hard
      # errors on the plural spelling. Outside the workspace, so ansible-lint
      # never walks it as project files.
      ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Install validation dependencies
        run: |
          # pipx, not pip --user: it keeps ansible's dependencies in their
          # own venvs. ansible-lint pulls ansible-core into its venv itself.
          pipx install ansible-core
          pipx install ansible-lint
          # The roles' non-builtin FQCNs resolve locally because requirements.txt
          # pins the batteries-included `ansible` package; here they have to be
          # fetched. --force and an explicit -p because without them galaxy sees
          # the runner's own preinstalled copies, reports "nothing to do", and
          # installs into a path ansible-lint does not read - a silent no-op.
          ansible-galaxy collection install -r ansible/requirements.yml \
            -p "$ANSIBLE_COLLECTIONS_PATH" --force
          ansible-galaxy collection list

      - name: copy examples
        run: |
          cp .sops.yaml.example .sops.yaml
          cp guards.tofu.example guards.tofu
          cp variables.tofu.example variables.tofu
          cp inventory-example.yaml inventory/example.yaml

      - name: tofu init and validate
        run: |
          tofu init -input=false
          tofu validate

      # check-ansible.sh needs an applied tofu state (it inspects the live
      # dynamic inventory), so CI runs only its state-independent parts.
      - name: ansible syntax check
        run: ansible-playbook ansible/site.yaml --syntax-check -i localhost,

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
