name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read-only rendering only: satisfies the state-encryption config and
      # its >=16-char validation. No state is created or read in CI.
      TF_VAR_state_passphrase: ci-dummy-passphrase-render-only
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Install validation dependencies
        run: |
          # pipx, not pip --user: it keeps ansible's dependencies in their
          # own venvs. ansible-lint pulls ansible-core into its venv itself.
          pipx install ansible-core
          pipx install ansible-lint
          # ansible-core ships no community collections, so without this the
          # roles' non-builtin FQCNs resolve locally (requirements.txt pins the
          # batteries-included `ansible` package) and fail here.
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: copy examples
        run: |
          cp .sops.yaml.example .sops.yaml
          cp guards.tofu.example guards.tofu
          cp variables.tofu.example variables.tofu
          cp inventory-example.yaml inventory/example.yaml

      - name: tofu init and validate
        run: |
          tofu init -input=false
          tofu validate

      # check-ansible.sh needs an applied tofu state (it inspects the live
      # dynamic inventory), so CI runs only its state-independent parts.
      - name: ansible syntax check
        run: ansible-playbook ansible/site.yaml --syntax-check -i localhost,

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
