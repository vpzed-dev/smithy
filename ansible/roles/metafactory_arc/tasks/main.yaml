# Installs the metafactory arc package manager (the package manager for the
# software under test) from its pinned git tag into ~/arc, linked into
# ~/.bun/bin. Login user, no become. Depends on the bun role having run
# first - list bun before metafactory_arc in ansible_roles.

- name: Probe for bun (cross-role dependency)
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.bun/bin/bun"
  register: metafactory_arc_bun

- name: Refuse to continue without bun
  ansible.builtin.fail:
    msg: >-
      The metafactory_arc role needs bun; list 'bun' before 'metafactory_arc'
      in the VM spec's ansible_roles.
  when: not metafactory_arc_bun.stat.exists

- name: Probe for git (layer-1 dependency)  # noqa: command-instead-of-module
  ansible.builtin.command: git --version
  register: metafactory_arc_git_probe
  changed_when: false
  failed_when: false

- name: Refuse to continue without git
  ansible.builtin.fail:
    msg: >-
      The metafactory_arc role needs git on the guest; add 'git' to the VM
      spec's packages list (layer 1) and reprovision, or install it by hand.
  when: metafactory_arc_git_probe.rc != 0

- name: Clone arc at the pinned tag
  ansible.builtin.git:
    repo: https://github.com/the-metafactory/arc.git
    dest: "{{ ansible_facts['user_dir'] }}/arc"
    version: "v{{ metafactory_arc_version }}"
    depth: 1
  register: metafactory_arc_repo

- name: Probe the arc link
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.bun/bin/arc"
  register: metafactory_arc_link

- name: Install dependencies and link arc
  when: metafactory_arc_repo is changed or not metafactory_arc_link.stat.exists
  environment:
    PATH: "{{ ansible_facts['user_dir'] }}/.bun/bin:{{ ansible_facts['env']['PATH'] }}"
  block:
    - name: Install production dependencies
      ansible.builtin.command:
        cmd: bun install --production --frozen-lockfile
        chdir: "{{ ansible_facts['user_dir'] }}/arc"
      changed_when: true

    - name: Link arc into ~/.bun/bin
      ansible.builtin.command:
        cmd: bun link
        chdir: "{{ ansible_facts['user_dir'] }}/arc"
      changed_when: true
